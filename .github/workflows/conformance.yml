name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication integrity (sha256 of every published file)
        run: sha256sum --check --strict PUBLICATION_INTEGRITY.txt
      - name: Install jsonschema
        run: python -m pip install "jsonschema>=4.18"
      - name: Vector suite and schema checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, validators

          suite = json.loads(Path("conformance/v0.1/vectors.json").read_text())
          vectors = suite["vectors"]
          assert len(vectors) == 33, f"expected 33 vectors, found {len(vectors)}"
          closed = {"unavailable", "declared", "verified", "conflict", "unsupported"}
          for v in vectors:
              assert v["expected"]["status"] in closed, v.get("id", v)
              http = v.get("http") or {}
              fixture = http.get("body_fixture")
              if fixture:
                  assert (Path("conformance/v0.1") / fixture).is_file(), fixture

          schema = json.loads(Path("schemas/ai4-proof-manifest-v1.schema.json").read_text())
          cls = validators.validator_for(schema, default=Draft202012Validator)
          cls.check_schema(schema)
          manifest = json.loads(Path("examples/valid-manifest.json").read_text())
          cls(schema).validate(manifest)
          print(f"OK: {len(vectors)} vectors, closed status set, fixtures present, schema valid, example manifest valid")
          PY
